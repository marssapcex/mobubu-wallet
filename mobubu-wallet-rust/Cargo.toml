[package]
name = "mobubu-wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
keccak = "0.1"
ed25519-dalek = { version = "2", features = ["rand-core"] }
secp256k1 = "0.27"
randomx = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.50", features = ["tcp", "dns", "noise", "yamux"] }
clap = { version = "4", features = ["derive"] }
sled = "0.34"
async-trait = "0.1"
rand = "0.8"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"

# FHE (TFHE-rs - enable with: cargo build --features tfhe-rs)
# tfhe = { version = "0.11", optional = true }

# ZK (placeholder - replace with arkworks when available)
# ark-snark = "0.4"

[features]
default = []
tfhe-rs = ["dep:tfhe"]

[dev-dependencies]
tokio-test = "0.4"

[workspace]
