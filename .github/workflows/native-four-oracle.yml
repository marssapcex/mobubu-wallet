name: Four native assets oracle lab

on:
  push:
    paths:
      - 'hcmtrail-native/**'
      - '.github/workflows/native-four-oracle.yml'
  pull_request:
    paths:
      - 'hcmtrail-native/**'
      - '.github/workflows/native-four-oracle.yml'

permissions:
  contents: read

jobs:
  isolated-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hcmtrail-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hcmtrail-native/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build && npm test
      - name: Execute on TVM with pinned compiler
        run: |
          bash scripts/fetch-tron-solc.sh "$RUNNER_TEMP/tron-solc"
          TRON_SOLC="$RUNNER_TEMP/tron-solc" npm run test:tvm
      - name: Execute encrypted TFHE math on laboratory vectors
        run: npm run test:fhe
