name: Four native assets vault, oracle and FHE lab

on:
  push:
    paths:
      - 'hcmtrail-native/**'
      - '.github/workflows/native-four-oracle.yml'
  pull_request:
    paths:
      - 'hcmtrail-native/**'
      - '.github/workflows/native-four-oracle.yml'

permissions:
  contents: read

jobs:
  isolated-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hcmtrail-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hcmtrail-native/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build && npm test
      - name: Build Zama Solidity quotes and check host integration in EDR
        run: npm run build:fhe && npm run test:fhe:evm
      - name: Replay funded native STARK withdrawals on EVM
        run: npm run build:vault && npm run test:vault
      - name: Execute oracle and funded native STARK withdrawal on TVM
        run: |
          bash scripts/fetch-tron-solc.sh "$RUNNER_TEMP/tron-solc"
          export TRON_SOLC="$RUNNER_TEMP/tron-solc"
          npm run test:tvm
          npm run build:vault -- --tvm
          npm run test:vault:tvm
      - name: Check four testnet domains, local signing and confirmed note recovery
        run: |
          export TRON_SOLC="$RUNNER_TEMP/tron-solc"
          npm run build:testnet
          npm run build:testnet -- --tvm
          npm run test:testnet
      - name: Build four HCMT fee vaults and exercise monthly accounting and relay guards
        run: |
          export TRON_SOLC="$RUNNER_TEMP/tron-solc"
          npm run build:dao
          npm run build:dao -- --tvm
          npm run test:dao
      - name: Execute encrypted TFHE math on laboratory vectors
        run: npm run test:fhe
      - name: Evaluate Solidity quote traces with bootstrapped TFHE and fixture callbacks
        run: npm run test:fhe:trace
