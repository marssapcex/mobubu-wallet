name: ETH pools, six payout routes and staking lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evm-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hcmtrail-native/package-lock.json
      - run: npm ci --ignore-scripts && npm --prefix hcmtrail-native ci --ignore-scripts
      - run: npm audit --audit-level=moderate && npm --prefix hcmtrail-native audit --audit-level=moderate
      - run: npm --prefix hcmtrail-native run build:pool:legacy
      - name: Verify all six routes, relay guards, staking and STARK regression
        run: npm test
      - run: npm --prefix hcmtrail-native run report:pool:256
