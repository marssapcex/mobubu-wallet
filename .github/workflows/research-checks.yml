name: Mobubu checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pq-vault-and-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build:contracts
      - run: npm test

  native-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci && npm --prefix fhe-swap ci
      - name: Install Bitcoin Core for isolated regtest
        run: |
          file="$RUNNER_TEMP/bitcoin-30.2-x86_64-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 https://bitcoincore.org/bin/bitcoin-core-30.2/bitcoin-30.2-x86_64-linux-gnu.tar.gz -o "$file"
          printf '%s  %s\n' 6aa7bb4feb699c4c6262dd23e4004191f6df7f373b5d5978b5bcdd4bb72f75d8 "$file" | sha256sum -c -
          tar -xzf "$file" -C "$RUNNER_TEMP" bitcoin-30.2/bin/bitcoind
          echo "BITCOIND=$RUNNER_TEMP/bitcoin-30.2/bin/bitcoind" >> "$GITHUB_ENV"
      - run: npm run test:swap

  fhe-and-streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fhe-swap/package-lock.json
      - run: npm ci
        working-directory: fhe-swap
      - run: npm audit --audit-level=moderate
        working-directory: fhe-swap
      - run: npm test
        working-directory: fhe-swap
      - name: Exercise the portable FFT path
        run: npm run build:native && node --test dist/test/tfhe-balance.test.js
        working-directory: fhe-swap
        env:
          TFHE_FFT: nayuki-portable
