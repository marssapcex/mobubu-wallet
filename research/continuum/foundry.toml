[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "verify/lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=verify/lib/forge-std/src/"]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 64 }

# `forge install foundry-rs/forge-std` replaces the verify/lib checkout.
